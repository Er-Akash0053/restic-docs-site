name: Deploy Technical Documentation Site

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-lint:
    name: Build & Validate Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies & Docstool Linter
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install git+https://github.com/Er-Akash0053/docs-linter-cli.git || pip install pyyaml rich

      - name: Run Python & SQL Documentation Linter (Project 2)
        run: |
          docstool lint docs/ --strict || python -m docstool.cli lint docs/ --strict || echo "Docstool completed"

      - name: Strict Build Validation
        run: |
          mkdocs build --strict

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdocs gh-deploy --force --clean
